; --- M10 controls: keyboard and mouse as a pad in the menus (UnGUICore.cpp LoadEmulatedPad, controls.md) ---
; Each line maps an engine key to a pad code, or to two separated by a slash: the second applies while the
; page has a text field. Type means the key types or edits;
; Raw means not converted. Pad codes: A B X Y Black White LeftTrigger RightTrigger PadUp PadDown PadLeft
; PadRight Start Back LeftThumb RightThumb AltUp AltDown AltLeft AltRight (right stick). Without this
; section Epic's hard-wired letters apply (A B X Y K W, Enter Start, Escape Back).
[GUI.EmulatedJoypad]
Up=PadUp
Down=PadDown
Left=PadLeft
Right=PadRight
W=PadUp/Type
S=PadDown/Type
A=PadLeft/Type
D=PadRight/Type
Enter=A/Start
Space=A/Type
Escape=B
Backspace=B/Type
RightMouse=B
X=X/Type
Y=Y/Type
Q=White/Type
E=Black/Type
PageUp=LeftTrigger
PageDown=RightTrigger
LeftBracket=LeftTrigger/Type
RightBracket=RightTrigger/Type
Tab=Start
F1=Back
Home=LeftThumb/Type
End=RightThumb/Type
Delete=Raw/Type
NumPad8=AltUp
NumPad2=AltDown
NumPad4=AltLeft
NumPad6=AltRight
MouseWheelUp=PadUp
MouseWheelDown=PadDown
; --- end M10 GUI keys ---


