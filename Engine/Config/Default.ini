; --- M10 controls: game pads through SDL's GameController API (docs/porting/analysis/controls.md) ---
; PadButtonThreshold 30 of 255 is the Xbox's XINPUT_GAMEPAD_MAX_CROSSTALK; the Xbox driver has no stick
; dead zone of its own (the bindings' DeadZone does it), hence PadStickDeadZone 0.
PadButtonThreshold=30
PadStickDeadZone=0.000000
PadRepeatDelay=0.200000
PadRepeatRate=0.100000
PadRumble=True
PadRumbleScale=1.000000
JoyDeadZone=0.350000
LogInput=False

; SDL controller control (SDL's names) to the Xbox control the game was written for: Joy1..Joy16 are
; the Xbox buttons A B X Y Black White LeftTrigger RightTrigger DPadUp DPadDown DPadLeft DPadRight Start
; Back LeftThumb RightThumb, JoyX JoyY the left stick and JoyU JoyV the right stick (Invert flips the sign).
[SDL2Drv.PadMap]
a=Joy1
b=Joy2
x=Joy3
y=Joy4
rightshoulder=Joy5
leftshoulder=Joy6
lefttrigger=Joy7
righttrigger=Joy8
dpup=Joy9
dpdown=Joy10
dpleft=Joy11
dpright=Joy12
start=Joy13
back=Joy14
leftstick=Joy15
rightstick=Joy16
leftx=JoyX
lefty=JoyY Invert
rightx=JoyU
righty=JoyV Invert
; --- end M10 pads ---

