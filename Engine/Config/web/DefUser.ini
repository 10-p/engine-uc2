[UCGameplay.UCPlayerInput]
; D-6: the MOUSE, with the rebuilt UCGameplay.u only (Epic's shipped package ignores these keys and sends the mouse
; through the pad's curve below, as Epic's PC build did). Turn per mouse count at the default FOV is
; 0.022 degrees x MouseLookSensitivity (the Quake/Source scale: 2.5 gives 0.055 deg/count, about 21 cm per 360
; degrees at 800 dpi; one count = one count of Epic's binding, Speed=6.0); it follows the zoom (x DesiredFOV/90).
; Linear: no clamp, curve, acceleration, friction, aim adhesion or auto-centring. Console: MouseLookSens <value>,
; MouseLookInvert <True|False>.
MouseLookSensitivity=2.5
bInvertMouseLook=False
; F-1: the third-person camera under the mouse: False = rigid (it sits behind the view at once, D-6), True = Epic's
; lazy camera (it lags behind and follows the turn, as under the pad and on the Xbox)
bLazyMouseCamera=False
; G-8: UT2004's double-tap dodge (rebuilt UCGameplay.u only; the shipped package ignores the key): True = a double tap
; of a movement key, or a double flick of the left stick, within [Engine.PlayerInput] DoubleClickTime (0.25 s) dodges
; that way, on the ground and against a wall in the air; not while the Lock button is held (taps pick the target).
; Space + direction dodges either way. UCGameplay is a server package: a network game needs the same package on both.
bDoubleTapDodge=False

; The GAME PAD (right stick), as the Xbox shipped it (retail DefUser.ini). MouseSensitivity_X/Y, bInvertMouse
; ([Engine.PlayerInput]) and aim assist are set by the profile (Options > Controller: X/Y SENSITIVITY, INVERT
; LOOK; Advanced: CAMERA ADHESION), whatever these say.
MouseSensitivity_X=1.0
MouseSensitivity_Y=0.9

bNonlinearAccel=true
aMouseX_Limit=100
aTurn_Limit=1024
aTurn_FallOff=2.0
aMouseY_Limit=100
aLookUp_Limit=1024
