; --- M10 controls: keyboard, mouse and pad defaults (docs/porting/analysis/controls.md, Engine/Config/README.md) ---
C=BlackButton | ToggleThirdCam
; The pad, as KeyBinds.ini Layout_0 (DEFAULT) applies it when a profile is loaded; here so a pad works before that.
; Joy1-16 are the Xbox buttons A B X Y Black White LeftTrigger RightTrigger DPadUp DPadDown DPadLeft DPadRight
; Start Back LeftThumb RightThumb (SDL2Drv [SDL2Drv.PadMap]).
Joy1=SmartJump 0
Joy2=MeleeWeapon | MeleeHeavyAttack | MeleePounceAttack
Joy3=button bCombo | ComboPressed
Joy4=MeleeFinishAttack | NextWeapon
Joy5=BlackButton | ToggleThirdCam
Joy6=WhiteButton | VoiceMenuNext
Joy7=AltFire | Shield 1 | onrelease Shield 0
Joy8=Fire
Joy9=Dpad_Up | VoiceMenuUp
Joy10=Dpad_Down | VoiceMenuDown
Joy11=Dpad_Left | ServerSetTeamChat 1
Joy12=Dpad_Right | ServerSetTeamChat 0
Joy13=ShowMenu
Joy14=ShowScores
Joy15=SmartJump 1
Joy16=Lock 1 | onrelease Lock 0
; The sticks as the Xbox binds them (retail DefUser.ini). The mouse (MouseX/MouseY) is bound as Epic bound it
; (Count bXAxis | Axis aMouseX Speed=6.0), into the same variables as the right stick: with Epic's shipped
; UCGameplay.u it goes through the stick's curve as on Epic's PC build; the rebuilt UCGameplay.u takes the mouse's
; share out (by the Count) and turns it linearly (the PC mouse). The keyboard moves and strafes, it never turns (the
; owner, 2026-10-09: WASD, and the arrows as in Epic's PC file); PageUp/PageDown push the look stick up/down to 0.8
; (Epic's curve, about 90 degrees a second, below the hold acceleration). F-1, analysis/vanilla.md.
JoyX=Axis aStrafe SpeedBase=100.0 DeadZone=0.3
JoyY=Axis aForward SpeedBase=100.0 DeadZone=0.3
JoyU=Axis aMouseX SpeedBase=100.0 DeadZone=0.3 | Count bXAxis
JoyV=Axis aMouseY SpeedBase=100.0 DeadZone=0.3 | Count bYAxis
JoySlider1=ControllerAdded
JoySlider2=ControllerRemoved
