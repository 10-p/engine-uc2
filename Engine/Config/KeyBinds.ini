;; UniqueName - name that will be used to represent this command in the layout ini sections
;; FriendlyName - name of this command (as it would appear in the menu)
;; Command - actual console command that performs this action
[Engine.ControllerConfigurationBase]
AvailableCommands=(UniqueName=Jump,FriendlyName="Jump",Command="SmartJump 0 | Axis aUp Speed=+1200.0")
AvailableCommands=(UniqueName=AltJump,FriendlyName="Jump",Command="SmartJump 1 | Axis aUp Speed=+1200.0")
AvailableCommands=(UniqueName=Melee,FriendlyName="Melee Mode,Heavy Attack",Command="MeleeWeapon | MeleeHeavyAttack")
AvailableCommands=(UniqueName=MeleeAndPounce,FriendlyName="Melee Mode,Heavy Attack|Pounce Attack|(in air)",Command="MeleeWeapon | MeleeHeavyAttack | MeleePounceAttack")
AvailableCommands=(UniqueName=Combo,FriendlyName="Combo Menu",Command="button bCombo | ComboPressed")
AvailableCommands=(UniqueName=Next,FriendlyName="Change View 1P/3P",Command="BlackButton")
AvailableCommands=(UniqueName=Prev,FriendlyName="Taunt Menu",Command="WhiteButton")
AvailableCommands=(UniqueName=AltFire,FriendlyName="Alt-Fire/Reflect",Command="AltFire | Shield 1 | onrelease Shield 0")
AvailableCommands=(UniqueName=Fire,FriendlyName="Fire",Command="Fire")
AvailableCommands=(UniqueName=VoiceUp,FriendlyName="Voice Menu",Command="Dpad_Up | VoiceMenuUp")
AvailableCommands=(UniqueName=VoiceDown,FriendlyName="Voice Menu",Command="Dpad_Down | VoiceMenuDown")
AvailableCommands=(UniqueName=VoiceChatTeam,FriendlyName="Team Voice Chat",Command="Dpad_Left | ServerSetTeamChat 1")
AvailableCommands=(UniqueName=VoiceChatGlobal,FriendlyName="Public Voice Chat",Command="Dpad_Right | ServerSetTeamChat 0")
AvailableCommands=(UniqueName=Menu,FriendlyName="Pause/Menu",Command="ShowMenu")
AvailableCommands=(UniqueName=Scoreboard,FriendlyName="Scoreboard",Command="ShowScores")
AvailableCommands=(UniqueName=Lock,FriendlyName="Lock / Unlock",Command="Lock 1 | onrelease Lock 0")
AvailableCommands=(UniqueName=Ranged,FriendlyName="Change Weapons",Command="MeleeFinishAttack | NextWeapon")
AvailableCommands=(UniqueName=RaceWeapon,FriendlyName="Pistols",Command="BlackButton | RaceWeapon")
AvailableCommands=(UniqueName=RaceWeaponFinish,FriendlyName="Pistols",Command="MeleeFinishAttack | RaceWeapon")
AvailableCommands=(UniqueName=Move,FriendlyName="Move")
AvailableCommands=(UniqueName=Look,FriendlyName="Look")
AvailableCommands=(UniqueName=TogglePerspective,FriendlyName="Change View 1P/3P",Command="WhiteButton | ToggleThirdCam")
AvailableCommands=(UniqueName=NextRifle,FriendlyName="Rifle Weapon",Command="MeleeFinishAttack | NextRifle")
AvailableCommands=(UniqueName=EnergyWeapon,FriendlyName="Energy Weapon",Command="BlackButton | EnergyWeapon")
AvailableCommands=(UniqueName=ExplosiveWeapon,FriendlyName="Explosive Weapon",Command="WhiteButton | ExplosiveWeapon")
AvailableCommands=(UniqueName=NextThird,FriendlyName="Change View 1P/3P",Command="BlackButton | ToggleThirdCam")
AvailableCommands=(UniqueName=PrevVoice,FriendlyName="Taunt Menu",Command="WhiteButton | VoiceMenuNext")

